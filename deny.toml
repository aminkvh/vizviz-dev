# cargo-deny: enforces the dependency license rule from CONTRIBUTING.md.
# Run: cargo deny check

[graph]
all-features = true

[licenses]
# Permissive only. Copyleft (GPL/LGPL/MPL) and non-commercial licenses are
# rejected; anything needing an exception must be added explicitly below
# with a comment explaining why.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "0BSD",
    # Font licenses for the fonts egui embeds (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

# Root-certificate store data used by xtask's HTTPS fetch; permissive
# data license, scoped to that one crate.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

# The JPEG screenshot encoder: permissive; binary releases acknowledge the
# Independent JPEG Group (NOTICE).
[[licenses.exceptions]]
allow = ["IJG"]
crate = "jpeg-encoder"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# Only flag unmaintained crates we depend on directly; transitive ones
# (e.g. `paste` under egui_dock, `ttf-parser` under winit) are upstream's
# call and get picked up when we bump those crates.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
