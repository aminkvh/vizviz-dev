name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # No GPU on the Linux runner: Mesa's software Vulkan (lavapipe) runs
      # the GPU tests there instead of skipping them.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude vv-py --all-targets -- -D warnings
      - run: cargo test --workspace --exclude vv-py

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project crates/vv-py
      - run: uv run --project crates/vv-py ruff check .
      - run: uv run --project crates/vv-py ruff format --check .
      - run: uv run --project crates/vv-py pytest crates/vv-py/tests

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit carries a Signed-off-by line
        run: |
          fail=0
          for c in $(git rev-list "${{ github.event.pull_request.base.sha }}..HEAD"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "missing DCO sign-off: $c"
              fail=1
            fi
          done
          exit $fail
